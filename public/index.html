<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<link rel="manifest" href="/manifest.json">
<title>نظریون — پیام‌رسان</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"></div>
<header class="top">
  <div class="brand"><span class="dot"></span> نظریون</div>
  <div id="status" class="status">در حال بررسی...</div>
  <button id="logout" class="ghost hidden">خروج</button>
</header>

<main>
<section id="auth" class="auth card">
  <div class="logo">N</div>
  <h1>به نظریون خوش آمدی</h1>
  <p class="muted">نسخه V1 — ورود و ثبت‌نام واقعی با Cloudflare D1</p>
  <div class="tabs">
    <button class="tab active" data-mode="login">ورود</button>
    <button class="tab" data-mode="register">ثبت‌نام</button>
  </div>
  <form id="authForm">
    <label>نام کاربری<input id="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="مثلاً mohammad_1"></label>
    <label>رمز عبور<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="حداقل ۸ کاراکتر"></label>
    <label id="displayWrap" class="hidden">نام نمایشی<input id="display_name" maxlength="50" placeholder="نام شما"></label>
    <button class="primary" type="submit" id="authSubmit">ورود</button>
  </form>
  <div id="authMsg" class="msg"></div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar card">
    <div class="me">
      <div class="avatar" id="myAvatar">N</div>
      <div><b id="myName">—</b><small id="myUsername">@—</small></div>
    </div>
    <div class="side-title">کاربران</div>
    <div class="search"><input id="userSearch" placeholder="جستجوی کاربر..."></div>
    <div id="userResults" class="list"></div>
    <div class="side-title">گفتگوها</div>
    <div id="chatList" class="list"></div>
  </aside>

  <section class="chat card">
    <div class="chatHead">
      <div>
        <b id="chatTitle">گفتگویی انتخاب نشده</b>
        <small id="chatSub">یک کاربر را جستجو کن</small>
      </div>
      <button id="refresh" class="ghost">↻</button>
    </div>
    <div id="messages" class="messages">
      <div class="empty">برای شروع، یک کاربر را از سمت راست انتخاب کن.</div>
    </div>
    <form id="sendForm" class="composer">
      <input id="message" maxlength="4000" placeholder="پیامت را بنویس..." disabled>
      <button class="primary" disabled id="sendBtn">ارسال</button>
    </form>
  </section>

  <aside class="right card">
    <div class="side-title">پروفایل</div>
    <label>نام نمایشی<input id="profileName" maxlength="50"></label>
    <label>بیو<input id="profileBio" maxlength="160"></label>
    <button id="saveProfile" class="primary">ذخیره پروفایل</button>
    <div id="profileMsg" class="msg"></div>
    <div class="side-title">استوری</div>
    <label>لینک تصویر HTTPS<input id="storyUrl" placeholder="https://..."></label>
    <label>متن<input id="storyCaption" maxlength="200"></label>
    <button id="addStory" class="primary">انتشار استوری</button>
    <div id="storyMsg" class="msg"></div>
    <div id="stories" class="stories"></div>
  </aside>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
